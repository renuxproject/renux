#
# A Renux release: `zig build image iso memstick` makes the whole system
# (the world, the kernel and the loader) into a bootable disk, an installer
# ISO and an installer memstick, as on any host, with the Zig the build is
# written for.  Pushing a `v*` tag builds them and publishes a GitHub
# release with the three images, their sha256 and its signature.  The
# signing key is the RENUX_RELEASE_SIGNING_KEY secret; its public half is
# .github/release/allowed_signers.
#
# The release notes are `.github/release/<version>.md`, where <version> is
# the tag without its leading `v`.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.17.1"
  ZIG_SHA256: "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"
  MACHINE: amd64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      version: ${{ steps.meta.outputs.version }}
      name: ${{ steps.meta.outputs.name }}
      sha: ${{ steps.meta.outputs.sha }}
      codename: ${{ steps.meta.outputs.codename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: The release's version
        id: meta
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          codename=$(sed -n 's/^const renux_codename: \[\]const u8 = "\(.*\)";$/\1/p' build.zig)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=renux-${version}-${MACHINE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "codename=$codename" >> "$GITHUB_OUTPUT"

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -eu
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$tarball" "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "${ZIG_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/zig" --strip-components=1
          rm "$tarball"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      # What the world takes from the host besides Zig, as in the snapshot
      # workflow: FreeBSD's tools/build commands, the C library and Linux
      # headers the host tools compile with, the three libraries they link
      # against, and bsdtar for the installer's distribution sets.
      - name: Host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            bash coreutils findutils diffutils sed grep gzip bzip2 xz-utils patch debianutils \
            binutils file sharutils \
            libc6-dev linux-libc-dev \
            libarchive-dev libssl-dev zlib1g-dev \
            libarchive-tools

      # The world's objects take several GB: make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: zig build image iso memstick
        id: media
        run: |
          set -o pipefail
          zig build image iso memstick -Dmachine="$MACHINE" -Dmodules=all --summary failures 2>&1 | tee media-build.log

      - name: The failure
        if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -120 media-build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          msg=$(grep -iE 'error:|fatal error|Error code' media-build.log | tail -40 | tr '\n' ' ' | cut -c1-12000 || true)
          echo "::error title=media build::$msg"

      - name: Compress
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          xz -T0 -6 -c "zig-out/renux-${MACHINE}.img" > "dist/${NAME}.img.xz" 2> /tmp/xz-img.err
          xz -T0 -6 -c "zig-out/renux-${MACHINE}-installer.iso" > "dist/${NAME}-installer.iso.xz" 2> /tmp/xz-iso.err
          xz -T0 -6 -c "zig-out/renux-${MACHINE}-memstick.img" > "dist/${NAME}-memstick.img.xz" 2> /tmp/xz-memstick.err
          cd dist
          sha256sum *.xz > SHA256
          cat SHA256 | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l

      - name: The compression failure
        if: failure()
        run: |
          set +e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/xz-img.err /tmp/xz-iso.err /tmp/xz-memstick.err 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
          df -h . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          msg=$(cat /tmp/xz-img.err /tmp/xz-iso.err /tmp/xz-memstick.err 2>/dev/null | tail -20 | tr '\n' ' ' | cut -c1-8000)
          echo "::error title=compression::$msg"

      # SHA256.sig: the release's signature, by the key whose public half
      # is .github/release/allowed_signers.  ssh-keygen is everywhere
      # OpenSSH is, so anyone checks it without the project's servers.
      # A release is never published unsigned, and the signature is
      # checked against the published key before it leaves the runner.
      - name: Sign
        env:
          RENUX_RELEASE_SIGNING_KEY: ${{ secrets.RENUX_RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${RENUX_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error title=sign::the RENUX_RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/renux-release"
          umask 077
          printf '%s\n' "$RENUX_RELEASE_SIGNING_KEY" > "$key"
          ssh-keygen -q -Y sign -f "$key" -n renux-release dist/SHA256 < /dev/null
          rm -f "$key"
          ssh-keygen -Y verify -f .github/release/allowed_signers \
            -I renux-release -n renux-release -s dist/SHA256.sig < dist/SHA256 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/
          retention-days: 30
          compression-level: 0

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.image.outputs.name }}
          path: dist

      - name: The release's notes
        env:
          VERSION: ${{ needs.image.outputs.version }}
          NAME: ${{ needs.image.outputs.name }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          set -eu
          short=$(printf '%s' "$SHA" | cut -c1-10)
          sed "s/@NAME@/${NAME}/g" ".github/release/${VERSION}.md" > body.md
          {
            echo "![Renux ${VERSION}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/.github/release/banner.png)"
            echo
            echo "Built on $(date -u +%Y-%m-%d) from [\`$short\`](https://github.com/${GITHUB_REPOSITORY}/commit/${SHA})."
            echo
            cat body.md
          } > notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.image.outputs.version }}
          CODENAME: ${{ needs.image.outputs.codename }}
        run: |
          set -eu
          title="Renux ${VERSION}"
          if [ -n "${CODENAME:-}" ]; then
            title="Renux ${VERSION} (${CODENAME})"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file notes.md
          fi
