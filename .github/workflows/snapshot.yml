#
# A snapshot of Renux: `zig build image iso` makes the whole system (the
# world, the kernel and the loader) into a bootable disk and an installer
# ISO, as on any host, with the Zig the build is written for.  They are
# kept, compressed, with their sha256 as the run's artifact; with
# `publish`, they also become a pre-release.
#
# The Renux Nightly build: every day at 18:00 in Brasília (21:00 UTC;
# Brasília has no daylight saving time), the snapshot is made and
# published.  GitHub may start a scheduled run some minutes late.  A
# nightly build is Renux in development, so it has no version: it is named
# by its machine, its day and its commit.

name: snapshot

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the snapshot as a pre-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
  MACHINE: amd64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -eu
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$tarball" "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "${ZIG_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/zig" --strip-components=1
          rm "$tarball"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      # What the world takes from the host besides Zig, as found by building
      # it on a Linux host (Arch's packages, here Ubuntu's):
      # - the commands FreeBSD's tools/build links into the build's PATH
      #   (hostname and time are zigtools): bash, coreutils, findutils,
      #   diffutils, sed, grep, gzip, bzip2, xz, patch, which;
      # - the C library and the Linux headers the host tools compile with;
      # - the libraries they link against and that are not built from the
      #   tree yet: libarchive (ar), OpenSSL (certctl), zlib (the CTF tools,
      #   elfcopy, mandoc, nm...);
      # - bsdtar, which makes the installer's distribution sets.
      - name: Host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            bash coreutils findutils diffutils sed grep gzip bzip2 xz-utils patch debianutils \
            libc6-dev linux-libc-dev \
            libarchive-dev libssl-dev zlib1g-dev \
            libarchive-tools

      # The world's objects take several GB: make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: The snapshot's name
        id: name
        run: |
          echo "name=renux-nightly-${MACHINE}-$(date -u +%Y%m%d)-$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"

      - name: zig build image iso
        run: zig build image iso -Dmachine="$MACHINE" --summary failures

      - name: Compress
        env:
          NAME: ${{ steps.name.outputs.name }}
        run: |
          set -eu
          mkdir snapshot
          xz -T0 -6 -c "zig-out/renux-${MACHINE}.img" > "snapshot/${NAME}.img.xz"
          xz -T0 -6 -c "zig-out/renux-${MACHINE}-installer.iso" > "snapshot/${NAME}-installer.iso.xz"
          cd snapshot
          sha256sum "${NAME}.img.xz" "${NAME}-installer.iso.xz" > SHA256
          cat SHA256 | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: snapshot/
          retention-days: 30
          compression-level: 0

  publish:
    # Every scheduled run publishes; a run by hand, when asked to.
    if: ${{ github.event_name == 'schedule' || inputs.publish }}
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The build's commit and the 10 before it, for the notes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.image.outputs.name }}
          path: snapshot

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.image.outputs.name }}
        run: |
          set -eu
          # renux-nightly-MACHINE-YYYYMMDD-COMMIT
          commit=${NAME##*-}
          day=${NAME%-*}
          day=${day##*-}
          sh .github/nightly/notes.sh "$NAME" > notes.md
          gh release create "${NAME#renux-}" snapshot/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Renux Nightly build · ${day:0:4}-${day:4:2}-${day:6:2} (${commit})" \
            --notes-file notes.md
