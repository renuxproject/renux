#
# Builds the kernel with `zig build kernel`, as on any host: nothing but
# the Zig the build is written for, checked against its published sha256.
# The kernel is built twice, on two runners, from two directories and with
# two caches, and the reproducible job checks that the two are the same
# bytes: the same as on any machine that builds the same commit.

name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSES/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSES/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.1"
  ZIG_SHA256: "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -eu
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$tarball" "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "${ZIG_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/zig" --strip-components=1
          rm "$tarball"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      # No cache of .zig-cache: Zig 0.17 compiles a C file again when its
      # inode or mtime changes, even with the same contents, and every
      # checkout makes new files.  A restored cache never hits; it only
      # grew by the whole build at every push.
      - name: zig build kernel
        run: zig build kernel --summary failures

      - name: The kernel
        run: |
          file zig-out/boot/kernel/kernel
          size zig-out/boot/kernel/kernel
          sha256sum zig-out/boot/kernel/kernel | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: zig-out/boot/kernel/kernel
          retention-days: 14

  # The same commit again, on another runner, from another directory and
  # with caches of its own, so that no path, cache or machine leaks into
  # the kernel.  The reproducible job checks the two are the same bytes.
  kernel-elsewhere:
    name: kernel, built elsewhere
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: elsewhere/renux-${{ github.run_id }}

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -eu
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$tarball" "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "${ZIG_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/zig" --strip-components=1
          rm "$tarball"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: zig build kernel
        working-directory: elsewhere/renux-${{ github.run_id }}
        run: |
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/another-global-cache"
          zig build kernel --summary failures --cache-dir "$RUNNER_TEMP/another-cache"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-elsewhere-${{ github.sha }}
          path: elsewhere/renux-${{ github.run_id }}/zig-out/boot/kernel/kernel
          retention-days: 14

  # PHILOSOPHY.md: the same tree and the same Zig give the same bytes, and
  # this is checked, not hoped for.
  reproducible:
    name: the kernel is reproducible
    needs: [kernel, kernel-elsewhere]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: a

      - uses: actions/download-artifact@v4
        with:
          name: kernel-elsewhere-${{ github.sha }}
          path: b

      - name: Compare
        run: |
          set -eu
          sha256sum a/kernel b/kernel | tee -a "$GITHUB_STEP_SUMMARY"
          if cmp -s a/kernel b/kernel; then
            echo "The two kernels are the same bytes." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          differing=$(cmp -l a/kernel b/kernel | wc -l || true)
          echo "::error title=reproducible::the two kernels differ in ${differing} bytes"
          {
            echo '```'
            cmp -l a/kernel b/kernel | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  modules:
    name: all kernel modules
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -eu
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$tarball" "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "${ZIG_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/zig" --strip-components=1
          rm "$tarball"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends binutils file sharutils
          objcopy --version | head -1
          uudecode --version 2>&1 | head -1

      # The modules' objects take several GB: make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: zig build modules
        id: modules
        run: |
          set -o pipefail
          zig build modules -Dmodules=all --summary failures 2>&1 | tee modules-build.log

      - name: The failure
        if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -120 modules-build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          msg=$(grep -iE 'error:|fatal error|Error code' modules-build.log | tail -40 | tr '\n' ' ' | cut -c1-12000 || true)
          echo "::error title=modules build::$msg"

      - name: The modules
        run: |
          set -eu
          count=$(find .zig-cache/modules -name '*.ko' | wc -l)
          echo "modules built: $count" | tee -a "$GITHUB_STEP_SUMMARY"
          find .zig-cache/modules -name '*.ko' -printf '%f\n' | sort > modules.txt
          head -5 modules.txt | while read -r m; do
            f=$(find .zig-cache/modules -name "$m" | head -1)
            file "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: module-list-${{ github.sha }}
          path: modules.txt
          retention-days: 14
